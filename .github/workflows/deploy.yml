name: Update Laravel

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: self-hosted

    steps:
      - name: Test Runner
        run: |
          echo "=== RUNNER TEST ==="
          whoami
          hostname
          pwd

      - name: Update source
        run: |
          cd /var/www/laravel
          echo "=== UPDATE SOURCE ==="
          git fetch origin main
          git reset --hard origin/main
          echo "=== CURRENT COMMIT ==="
          git log -1 --oneline
          echo "=== UPDATE SUCCESS ==="
